
name: Build and Test Nigga Tekst

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Launch app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.dialoguenotes/.MainActivity
            sleep 8
            adb logcat -d -s AndroidRuntime:E > emulator-crash.log
            if grep -q "FATAL EXCEPTION" emulator-crash.log; then
              cat emulator-crash.log
              exit 1
            fi
            adb shell pidof com.example.dialoguenotes

      - name: Save emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-emulator-logs
          path: emulator-crash.log
          if-no-files-found: ignore

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
