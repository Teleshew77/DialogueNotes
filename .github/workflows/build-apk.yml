
name: Nigga Tekst - Android Launch Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Test Android 11 launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            timeout 45s adb shell am start -n com.example.dialoguenotes/.MainActivity
            sleep 15
            adb logcat -d -v time > emulator-crash.log
            adb exec-out screencap -p > screenshot.png
            adb shell pidof com.example.dialoguenotes
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|ResumedActivity" | grep com.example.dialoguenotes
            echo "NIGGA TEKST LAUNCH TEST PASSED"

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-Diagnostics
          path: |
            emulator-crash.log
            screenshot.png
          if-no-files-found: ignore

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
