name: Nigga Tekst - Android 11 Stable Launch Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Test Android 11 launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash .github/scripts/verify-launch.sh

      - name: Upload diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-test-report
          path: test-report/
          if-no-files-found: ignore

      - name: Upload APK only after successful launch test
        uses: actions/upload-artifact@v4
        with:
          name: Nigga-Tekst-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
